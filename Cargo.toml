[package]
name = "mcp-websocket-proxy"
version = "0.1.0"
edition = "2021"
authors = ["Eliot"]
description = "Ultra-fast, low-RAM Model Context Protocol (MCP) stdio-to-WebSocket proxy and router."
license = "MIT"
repository = "https://github.com/furymob-git/mcp-websocket-proxy"
readme = "README.md"
keywords = ["mcp", "websocket", "proxy", "roblox", "json-rpc"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "io-util", "io-std", "process", "signal", "sync", "time"] }
tokio-tungstenite = "0.24"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
toml = "1.1"
bytes = "1.7"
dashmap = "6.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.dist]
cargo-dist-version = "0.28.0"
ci = "github"
installers = ["shell", "powershell", "npm"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
prerelease = false

