name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan Release
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.plan.outputs.val }}
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/latest/download/cargo-dist-installer.sh | sh
      - id: plan
        run: |
          cargo dist plan --output-format=json > dist-manifest.json
          echo "val=$(cat dist-manifest.json | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-plan
          path: dist-manifest.json

  build:
    name: Build (${{ matrix.target }})
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cargo-dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/latest/download/cargo-dist-installer.sh | sh
      - name: Build binary with cargo-dist
        shell: bash
        run: cargo dist build --target ${{ matrix.target }} --output-format=json
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: target/distrib/*

  publish:
    name: Publish GitHub Release
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Install cargo-dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/latest/download/cargo-dist-installer.sh | sh
      - name: Prepare Release Assets & Checksums
        run: |
          mkdir -p dist-final
          find artifacts -type f -exec cp {} dist-final/ \;
          cd dist-final
          sha256sum * > SHA256SUMS.txt || true
          cd ..
      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [[ "$TAG" == *"main"* ]]; then
            TAG="v$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          fi
          gh release upload "$TAG" dist-final/* --clobber || gh release create "$TAG" dist-final/* --title "$TAG" --generate-notes

  publish-npm:
    name: Publish NPM Package
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to NPM
        if: env.NPM_TOKEN != ''
        working-directory: packages/npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
