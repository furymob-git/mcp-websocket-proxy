name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.asset_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: mcp-websocket-proxy.exe
            asset_name: mcp-websocket-proxy-windows-x64.exe
            archive_ext: .zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: mcp-websocket-proxy
            asset_name: mcp-websocket-proxy-linux-x64
            archive_ext: .tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin_name: mcp-websocket-proxy
            asset_name: mcp-websocket-proxy-linux-musl-x64
            archive_ext: .tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: mcp-websocket-proxy
            asset_name: mcp-websocket-proxy-macos-arm64
            archive_ext: .tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            bin_name: mcp-websocket-proxy
            asset_name: mcp-websocket-proxy-macos-x64
            archive_ext: .tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install musl tools (Linux musl only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build standalone release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package standalone executable and archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-assets
          $binPath = "target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          Copy-Item $binPath "dist-assets/${{ matrix.asset_name }}"
          Compress-Archive -Path $binPath -DestinationPath "dist-assets/mcp-websocket-proxy-${{ matrix.target }}.zip"

      - name: Package standalone executable and archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist-assets
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          cp "$BIN_PATH" "dist-assets/${{ matrix.asset_name }}"
          chmod +x "dist-assets/${{ matrix.asset_name }}"
          tar -czf "dist-assets/mcp-websocket-proxy-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" "${{ matrix.bin_name }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: dist-assets/*

  publish:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Final Release Assets & Checksums
        shell: bash
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          cd release-files
          sha256sum * > SHA256SUMS.txt
          ls -la
          cd ..

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [[ "$TAG" == *"main"* ]]; then
            TAG="v$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          fi
          echo "Publishing release for $TAG"
          gh release upload "$TAG" release-files/* --clobber || gh release create "$TAG" release-files/* --title "$TAG" --generate-notes

  publish-npm:
    name: Publish NPM Package
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to NPM
        if: env.NPM_TOKEN != ''
        working-directory: packages/npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
