name: Feature Request
description: Propose a new feature, flag, or protocol enhancement
title: "feat: <short feature proposal>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make `mcp-websocket-proxy` better? We'd love to hear it.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or specific use case (e.g. Godot, Unity, custom web client)?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working in practice.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Considered Alternatives
      description: Any alternative implementations or workarounds you have considered.
